<!doctype html>
<html lang="en" data-launch-candidate="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <base href="/" />
    <link rel="canonical" href="https://mobilecryopro.com/about.html" />
    <title>About Dan | Mobile Cryo Pro</title>
    <meta
      name="description"
      content="Meet Dan Belben and learn how Mobile Cryo Pro provides localized cryotherapy and CryoSkin services across the North Bay."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/sandbox/styles.css?v=210" />
    <link rel="icon" href="/favicon.ico?v=9" sizes="any" />
  </head>
  <body class="about-page sandbox-about-page sandbox-about-loading">
    <main class="sandbox-about-loader" id="main-content">
      <p class="eyebrow">About</p>
      <h1>Loading the About page</h1>
    </main>

    <script>
      (() => {
        "use strict";

        const rewriteSandboxLinks = () => {
          const redirects = new Map([
            ["index.html", "/sandbox/index.html"],
            ["index.html#service-area", "/sandbox/index.html#service-area"],
            ["about.html", "/sandbox/about.html"],
            ["services.html", "/sandbox/services.html"],
            ["blog.html", "/sandbox/guides/index.html"]
          ]);

          document.querySelectorAll("a[href]").forEach((link) => {
            const href = link.getAttribute("href");
            const sandboxHref = redirects.get(href);
            if (sandboxHref) {
              link.href = sandboxHref;
              if (href === "blog.html") link.textContent = "Guides";
            }
          });

          const aboutLink = document.querySelector('.site-nav a[href="/sandbox/about.html"]');
          if (aboutLink) aboutLink.setAttribute("aria-current", "page");

          const servicesLink = document.querySelector('.site-nav a[href="/sandbox/services.html"]');
          if (servicesLink && !document.querySelector('.site-nav a[href="/sandbox/gallery.html"]')) {
            const galleryLink = document.createElement("a");
            galleryLink.href = "/sandbox/gallery.html";
            galleryLink.textContent = "Gallery";
            servicesLink.after(galleryLink);
          }

          const navigationCta = document.querySelector(".site-nav .nav-cta");
          if (navigationCta) navigationCta.textContent = "Check Availability";

          const contactCopy = document.querySelector(".footer-form-panel .footer-copy p");
          if (contactCopy) {
            contactCopy.innerHTML = 'Share the service or goal, your location, and the timing you have in mind. You&rsquo;re also welcome to call or text <a class="footer-call-link" href="tel:+17074139366">(707) 413-9366</a>.';
          }

          const footerLinks = document.querySelector(".footer-links");
          if (footerLinks && !footerLinks.querySelector('a[href="/sandbox/privacy.html"]')) {
            const privacyLink = document.createElement("a");
            const termsLink = document.createElement("a");
            privacyLink.href = "/sandbox/privacy.html";
            privacyLink.textContent = "Privacy";
            termsLink.href = "/sandbox/terms.html";
            termsLink.textContent = "Terms";
            footerLinks.append(privacyLink, termsLink);
          }

          document.querySelectorAll("[data-contact-form]").forEach((form) => {
            if (form.querySelector(".form-privacy-note")) return;
            const note = document.createElement("p");
            note.className = "form-privacy-note";
            note.innerHTML = 'Use this form for scheduling details, not medical records. By sending, you authorize a reply about your request. <a href="/sandbox/privacy.html">Privacy Policy</a>';
            const depositLink = form.querySelector(".booking-deposit-link");
            if (depositLink) depositLink.before(note);
            else form.append(note);
          });
        };

        const showError = () => {
          document.body.classList.remove("sandbox-about-loading");
          document.body.innerHTML =
            '<main class="sandbox-about-loader" id="main-content"><p class="eyebrow">About</p><h1>The About page is temporarily unavailable</h1><p>Please <a href="/sandbox/index.html">return to the homepage</a> or <a href="tel:+17074139366">call or text (707) 413-9366</a>.</p></main>';
        };

        fetch("/about.html", { cache: "no-cache" })
          .then((response) => {
            if (!response.ok) throw new Error(`About page returned ${response.status}`);
            return response.text();
          })
          .then((html) => {
            const source = new DOMParser().parseFromString(html, "text/html");
            const pageShell = source.querySelector(".page-shell");
            if (!pageShell) throw new Error("About page shell was not found");

            document.body.className = "about-page sandbox-about-page";
            document.body.innerHTML =
              '<a class="skip-link" href="#main-content">Skip to content</a>' +
              pageShell.outerHTML;

            const heroMedia = document.querySelector(".about-hero-media");
            if (heroMedia) {
              heroMedia.style.setProperty(
                "--about-hero-image",
                "url('/assets/recovery-shoulder-assessment-1280.webp')"
              );
            }

            rewriteSandboxLinks();

            const siteScript = document.createElement("script");
            siteScript.src = "/script.js?v=33";
            siteScript.addEventListener("load", rewriteSandboxLinks);
            document.body.append(siteScript);
          })
          .catch((error) => {
            console.error("About preview failed", error);
            showError();
          });
      })();
    </script>
  </body>
</html>
